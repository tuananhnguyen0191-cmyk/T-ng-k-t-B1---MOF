ing:13px 17px;font-weight:900;cursor:pointer}.red{background:#e31837;color:#fff}.white{background:#fff;border:1px solid #e7dde0;color:#4e4548}.bar{height:9px;background:#f1e9eb;border-radius:99px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e31837,#ff6379);width:5%}.muted{color:#767078;font-size:13px}.leader{margin-top:14px;text-align:left}.leader div{display:flex;justify-content:space-between;padding:9px 3px;border-bottom:1px solid #f0eaec}.join{max-width:570px;margin:60px auto}.input{width:100%;border:2px solid #eee;border-radius:14px;padding:14px;font-size:18px;margin:12px 0}.pick{width:100%;border:2px solid #eee;background:#fff;border-radius:16px;padding:16px;margin:7px 0;text-align:left;font-size:16px;cursor:pointer}.pick:hover{border-color:#e31837}.pick b{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#e31837;color:white;margin-right:9px}.result{text-align:center;padding:25px;border-radius:18px;background:#fff3f5}.score{font-size:36px;font-weight:950;color:#e31837}@media(max-width:760px){.wrap{padding:12px}.hero{border-radius:20px;padding:21px}.hero h1{font-size:28px}.grid{grid-template-columns:1fr}.side{display:flex;align-items:center;justify-content:space-between}.timer{width:95px;height:95px;font-size:33px}.answers{grid-template-columns:1fr}.q{font-size:20px}.card{padding:18px}}</style></head><body><main class="wrap" id="app"></main><script>const QS=[{"id": "G23_99", "q": "Người được bảo hiểm tham gia bảo hiểm chăm sóc sức khỏe với hạn mức 2 triệu đồng/1 ngày nằm viện. Người được bảo hiểm nằm viện 3 ngày. Tổng chi phí nằm viện khi xuất viện là 7 triệu đồng. Doanh nghiệp hiểm chi trả số tiền là:", "o": ["7 triệu đồng", "6 triệu đồng", "2 triệu đồng", ""], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: 6 triệu đồng. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_123", "q": "Rủi ro là khả năng biến cố bất thường có hậu quả thiệt hại hoặc mang lại không như mong đợi. Trong trường hợp người chịu ảnh hưởng của rủi ro có thể gặp hậu quả xấu nhưng cũng có thể đạt được sự gia tăng lợi ích thì rủi ro đó", "o": ["Rủi ro thuần túy", "Rủi ro đầu cơ", "Rủi ro chung", "Rủi ro riêng"], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Rủi ro đầu cơ. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_132", "q": "Ông A dự kiến bay từ Hà Nội và TP Hồ Chí Minh vào ngày 01/03/2024, tuy nhiên vào 01/03/2024 theo dự báo thời tiết sẽ có bão to, vì vậy ông A lùi lịch bay sang ngày 03/03/2024. Lựa chọn này của ông A là biện pháp phòng tránh rủi ro nào sau đây:", "o": ["Né tránh rủi ro.", "Kiểm soát rủi ro.", "Chấp nhận rủi ro.", "Đánh giá rủi ro."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Né tránh rủi ro.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G26_30", "q": "Theo Luật Kinh doanh bảo hiểm bắt buộc bao gồm:", "o": ["Bảo hiểm bắt buộc người ngồi trên xe cơ giới", "Bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới", "Bảo hiểm bắt buộc thiệt hại vật chất xe cơ giới", "A, B, C đúng"], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_61", "q": "Rủi ro thuần túy là rủi ro có hậu quả:", "o": ["Liên quan đến khả năng đầu cơ.", "Liên quan đến khả năng tổn thất.", "Liên quan đến khả năng đầu cơ và khả năng tổn thất.", "Không phương án nào đúng."], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Liên quan đến khả năng tổn thất.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_21", "q": "Phát biểu nào sau đây là đúng khi nói về bảo hiểm hỗn hợp:", "o": ["Doanh nghiệp bảo hiểm bồi thường, trả tiền bảo hiểm cả khi người được bảo hiểm còn sống đến hết thời hạn bảo hiểm hoặc tử vong trong thời hạn bảo hiểm.", "Doanh nghiệp bảo hiểm chỉ bồi thường, trả tiền bảo hiểm khi người được bảo hiểm còn sống đến hết thời hạn bảo hiểm.", "Doanh nghiệp bảo hiểm chỉ bồi thường, trả tiền bảo hiểm khi người được bảo hiểm tử vong trong thời hạn bảo hiểm.", "Hợp đồng bảo hiểm hỗn hợp không có giá trị hoàn lại."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Doanh nghiệp bảo hiểm bồi thường, trả tiền bảo hiểm cả khi người được bảo hiểm còn sống đến hết thời hạn bảo hiểm hoặc tử vong trong thời hạn bảo hiểm.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_142", "q": "Lựa chọn đáp án đúng về các loại nghiệp vụ bảo hiểm nhân thọ:", "o": ["Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm hưu trí.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm sức khỏe, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm sức khỏe, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm hưu trí.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 2}, {"id": "G23_184", "q": "Chọn phương án đúng về thời hạn bảo hiểm:", "o": ["Là khoảng thời gian mà nếu sự kiện bảo hiểm xảy ra, người được bảo hiểm không được nhận quyền lợi bảo hiểm.", "Là thời gian bên mua bảo hiểm đóng phí bảo hiểm cho doanh nghiệp theo thỏa thuận tại hợp đồng bảo hiểm.", "Là thời gian có hiệu lực của hợp đồng bảo hiểm và được ghi trên giấy chứng nhận bảo hiểm.", ""], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Là thời gian có hiệu lực của hợp đồng bảo hiểm và được ghi trên giấy chứng nhận bảo hiểm.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_90", "q": "Đáp án nào sau đây là đúng khi nói về bảo hiểm trả tiền định kỳ:", "o": ["Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm chết trong thời hạn hợp đồng.", "Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm bị tai nạn, ốm đau, mất khả năng lao động.", "Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm sống đến một thời hạn nhất định, sau đó doanh nghiệp bảo hiểm phải trả tiền bảo hiểm định kỳ cho người thụ hưởng theo thỏa thuận trong hợp đồng bảo hiểm.", "A, B đúng."], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm sống đến một thời hạn nhất định, sau đó doanh nghiệp bảo hiểm phải trả tiền bảo hiểm định kỳ cho người thụ hưởng theo thỏa thuận trong hợp đồng bảo hiểm.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 2}, {"id": "G22_26", "q": "Bảo hiểm là phương pháp phòng tránh rủi ro nào sau đây:", "o": ["Giữ lại rủi ro.", "Né tránh rủi ro.", "Kiểm soát rủi ro.", "Chuyển giao rủi ro."], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: Chuyển giao rủi ro.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 2}, {"id": "G23_93", "q": "Theo Luật Kinh doanh bảo hiểm, bảo hiểm sức khỏe là loại hình bảo hiểm cho trường hợp:", "o": ["Người được bảo hiểm sống đến một thời hạn nhất định.", "Người được bảo hiểm chết trong một thời hạn nhất định.", "Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chết vào bất kỳ thời điểm nào trong suốt cuộc đời của người đó.", "Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chăm sóc sức khỏe."], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chăm sóc sức khỏe.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_143", "q": "Nghiệp vụ bảo hiểm liên kết đầu tư bao gồm:", "o": ["Bảo hiểm liên kết đơn vị, bảo hiểm hưu trí, bảo hiểm liên kết chung.", "Bảo hiểm liên kết đơn vị, bảo h
